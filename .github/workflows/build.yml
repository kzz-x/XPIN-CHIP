name: Build XPIN-CHIP and portable HTML
on:
  push:
    branches: [main]
    paths-ignore:
      - "XPIN-CHIP-Standalone.html"
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check and bundle
        run: npm run build
      - name: Generate fully offline single-file HTML
        run: python3 scripts/build-standalone.py
      - name: Publish single HTML to main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XPIN-CHIP-Standalone.html
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh offline standalone HTML [skip ci]"
            git push
          fi
